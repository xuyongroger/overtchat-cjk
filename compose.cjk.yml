# Fork-only compose overlay: points the app service at the Chinese-localized
# app image built by .github/workflows/app-cjk.yml. Upstream compose.yml is
# never modified; everything else (ports, environment, volumes, networks,
# sidecars) is inherited from compose.yml unchanged.
#
# Usage (from the deploy directory with the usual .env):
#   docker compose -f compose.yml -f compose.cjk.yml up -d app
#
# The tag follows APP_CJK_VERSION (default: latest). After a verified build,
# pin a known-good run with its sha-<short> tag in .env.
services:
  app:
    image: ghcr.io/xuyongroger/overtchat-app-cjk:${APP_CJK_VERSION:-latest}
