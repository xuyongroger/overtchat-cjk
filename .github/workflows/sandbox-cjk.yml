name: Build CJK sandbox image

# Builds both CJK sandbox tiers in parallel and runs the sandbox test suite
# inside each built image (docs/development.md#code-sandbox-validation).
# slim is the lean Chinese-capable tier; full adds pandoc and LibreOffice
# (writer, calc, impress) minus ffmpeg on top of it. When the tests pass,
# the images are published to this repository's GitHub Packages (GHCR) so
# they can be pulled with plain `docker pull`. Package visibility follows
# the repository: public repo pulls without login.
#
# Tags: slim gets `latest` and `sha-<short>`; full gets `full` and
# `sha-<short>-full`.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/overtchat-sandbox-cjk

concurrency:
  group: sandbox-cjk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally (no push yet) so the image can be tested first.
      - name: Build slim image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          target: slim
          build-args: SANDBOX_VERSION=${{ github.sha }}
          load: true
          tags: local/overtchat-sandbox-cjk:test
          cache-from: type=gha,scope=sandbox-slim
          cache-to: type=gha,scope=sandbox-slim,mode=max

      # Production container settings from docs/development.md; the suite
      # covers Chinese charts, PDF/Word/Excel round-trips and OCR.
      - name: Test the image
        run: |
          docker run --rm --init --read-only \
            --tmpfs /runs:size=512m,mode=0711 --tmpfs /tmp:size=64m \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add CHOWN \
            --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add KILL \
            --security-opt no-new-privileges:true --pids-limit 512 \
            -v "$PWD/sandbox:/tests:ro" \
            local/overtchat-sandbox-cjk:test \
            python -B -W error::ResourceWarning -m unittest discover -s /tests -p 'test_*.py'

      - name: Describe the published image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: org.opencontainers.image.revision=${{ github.sha }}

      # Cache hit from the build above; this step only pushes.
      - name: Publish to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          target: slim
          build-args: SANDBOX_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-slim
          cache-to: type=gha,scope=sandbox-slim,mode=max

      - name: Show the pull command
        run: |
          {
            echo "## slim published (latest)"
            echo ""
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build full image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          target: full
          build-args: SANDBOX_VERSION=${{ github.sha }}
          load: true
          tags: local/overtchat-sandbox-cjk-full:test
          cache-from: type=gha,scope=sandbox-full
          cache-to: type=gha,scope=sandbox-full,mode=max

      # The same suite; the tier-gated tests (pandoc, LibreOffice conversions,
      # Chinese docx/xlsx/pptx layout round-trips) run here and are skipped
      # in the slim job.
      - name: Test the image
        run: |
          docker run --rm --init --read-only \
            --tmpfs /runs:size=512m,mode=0711 --tmpfs /tmp:size=64m \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add CHOWN \
            --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add KILL \
            --security-opt no-new-privileges:true --pids-limit 512 \
            -v "$PWD/sandbox:/tests:ro" \
            local/overtchat-sandbox-cjk-full:test \
            python -B -W error::ResourceWarning -m unittest discover -s /tests -p 'test_*.py'

      - name: Describe the published image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=full
            type=sha,prefix=sha-,suffix=-full
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          target: full
          build-args: SANDBOX_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-full
          cache-to: type=gha,scope=sandbox-full,mode=max

      - name: Show the pull command
        run: |
          {
            echo "## full published (pandoc + LibreOffice, no ffmpeg)"
            echo ""
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:full"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${GITHUB_SHA::7}-full"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
