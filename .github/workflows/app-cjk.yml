name: Build CJK app image

# Manual-only build of the web app image that carries the fork's built-in
# Chinese UI (lib/i18n runtime dictionary overlay plus the three minimal
# upstream edits: spa/App.tsx, app/layout.tsx, chat/MessageBubble.tsx).
# Upstream's own app-image.yml keeps running on release tags untouched;
# this workflow is a fork-only companion so merges stay upstream-first.
#
# Tags: `latest` and `sha-<short>`.
# Platforms: linux/amd64 only — the deploy NAS is amd64, and single-arch
# builds natively on the runner (no QEMU, much faster). This is a personal
# deployment line, not the upstream multi-arch release.
#
# Image is published to GHCR; package visibility follows the repository, so a
# public repo can be pulled without login. Consume it with compose.cjk.yml:
#   docker compose -f compose.yml -f compose.cjk.yml up -d app

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/overtchat-app-cjk

concurrency:
  group: app-cjk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the published image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app-cjk
          cache-to: type=gha,scope=app-cjk,mode=max

      - name: Show the pull command
        run: |
          {
            echo "## CJK app image published"
            echo ""
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
            echo ""
            echo "docker compose -f compose.yml -f compose.cjk.yml up -d app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
